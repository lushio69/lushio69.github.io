<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-label="几何证明中的辅助线">
  <defs>
    <pattern id="grid-pr" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#0e6b54" stroke-opacity="0.08" stroke-width="1"/>
    </pattern>
    <filter id="grain-pr">
      <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.04"/></feComponentTransfer>
    </filter>
  </defs>
  <rect width="1200" height="800" fill="#edf1e9"/>
  <rect width="1200" height="800" fill="url(#grid-pr)"/>
  <g transform="translate(600 404)">
    <circle cx="0" cy="0" r="238" fill="none" stroke="#17211c" stroke-width="1.6" opacity="0.7"/>
    <circle cx="0" cy="0" r="154" fill="none" stroke="#0e6b54" stroke-width="1.2" stroke-dasharray="5 7" opacity="0.65"/>
    <path d="M-206 120L0-238 206 120Z" fill="none" stroke="#17211c" stroke-width="3" stroke-linejoin="round"/>
    <path d="M0-238V120" stroke="#b1783a" stroke-width="1.4" stroke-dasharray="5 6"/>
    <path d="M-206 120H206" stroke="#0e6b54" stroke-width="1.4" stroke-dasharray="5 6"/>
    <path d="M0 0L206 120M0 0L-206 120M0 0L0-238" stroke="#b1783a" stroke-width="1.2" opacity="0.65"/>
    <circle cx="0" cy="0" r="7" fill="#b1783a"/>
    <circle cx="0" cy="-238" r="6" fill="#0e6b54"/>
    <circle cx="-206" cy="120" r="6" fill="#0e6b54"/>
    <circle cx="206" cy="120" r="6" fill="#0e6b54"/>
    <path d="M-26 0A26 26 0 0 1 0 26" fill="none" stroke="#b1783a" stroke-width="1.3"/>
    <text x="24" y="-194" font-family="Georgia, serif" font-size="18" fill="#0e6b54">A</text>
    <text x="-238" y="146" font-family="Georgia, serif" font-size="18" fill="#0e6b54">B</text>
    <text x="222" y="146" font-family="Georgia, serif" font-size="18" fill="#0e6b54">C</text>
    <text x="20" y="46" font-family="Georgia, serif" font-size="18" fill="#b1783a">O</text>
    <text x="-118" y="278" font-family="Georgia, serif" font-size="22" fill="#17211c">a² + b² = c²</text>
  </g>
  <g transform="translate(150 140)">
    <text x="0" y="0" font-family="Consolas, monospace" font-size="12" fill="#65716a" letter-spacing="2">PROOF / AUXILIARY LINES</text>
    <text x="0" y="46" font-family="Georgia, serif" font-size="32" fill="#17211c">why must it be true?</text>
  </g>
  <g fill="none" stroke="#17211c" opacity="0.28">
    <path d="M942 140l98 0M942 166l64 0M942 192l82 0"/>
  </g>
  <rect width="1200" height="800" filter="url(#grain-pr)" opacity="0.9"/>
  <rect x="28" y="28" width="1144" height="744" fill="none" stroke="#17211c" stroke-opacity="0.12"/>
</svg>
