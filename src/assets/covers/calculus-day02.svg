    <text x="0" y="56" font-family="Georgia, serif" font-size="35" fill="#17211c">f′(a) = lim h→0</text>
  </g>
  <text x="348" y="756" font-family="Georgia, serif" font-size="22" fill="#65716a">the slope that survives the limit</text>
