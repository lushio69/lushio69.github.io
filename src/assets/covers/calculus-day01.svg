<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-label="从平均变化率到瞬时变化率">
  <defs>
    <pattern id="grid-d1" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#0e6b54" stroke-opacity="0.08" stroke-width="1"/>
    </pattern>
    <filter id="grain-d1">
      <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.04"/></feComponentTransfer>
    </filter>
  </defs>
  <rect width="1200" height="800" fill="#edf2eb"/>
  <rect width="1200" height="800" fill="url(#grid-d1)"/>
  <line x1="160" y1="620" x2="1030" y2="620" stroke="#17211c" stroke-width="1.5"/>
  <line x1="220" y1="150" x2="220" y2="650" stroke="#17211c" stroke-width="1.5"/>
  <path d="M270 580C380 560 470 500 570 410c100-90 180-150 330-140" fill="none" stroke="#0e6b54" stroke-width="4"/>
  <circle cx="490" cy="470" r="7" fill="#b1783a"/>
  <circle cx="700" cy="322" r="7" fill="#b1783a"/>
  <line x1="490" y1="470" x2="700" y2="322" stroke="#b1783a" stroke-width="1.8" stroke-dasharray="6 6"/>
  <text x="454" y="446" font-family="Georgia, serif" font-size="18" fill="#b1783a">Δt</text>
  <text x="712" y="316" font-family="Georgia, serif" font-size="20" fill="#0e6b54">s(t)</text>
  <text x="976" y="654" font-family="Georgia, serif" font-size="20" fill="#17211c">t</text>
  <g transform="translate(150 142)">
    <text x="0" y="0" font-family="Consolas, monospace" font-size="12" fill="#65716a" letter-spacing="2">DAY 01 / AVERAGE TO INSTANT</text>
    <text x="0" y="56" font-family="Georgia, serif" font-size="35" fill="#17211c">Δs / Δt</text>
  </g>
  <text x="716" y="726" font-family="Georgia, serif" font-size="22" fill="#65716a">v(t) = lim Δs / Δt</text>
  <text x="716" y="762" font-family="Consolas, monospace" font-size="11" fill="#65716a" letter-spacing="1.5">AS Δt → 0</text>
  <rect width="1200" height="800" filter="url(#grain-d1)" opacity="0.9"/>
  <rect x="28" y="28" width="1144" height="744" fill="none" stroke="#17211c" stroke-opacity="0.12"/>
</svg>
