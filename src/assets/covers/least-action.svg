<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-label="多条可能路径中的真实路径">
  <defs>
    <pattern id="grid-la" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#0e6b54" stroke-opacity="0.08" stroke-width="1"/>
    </pattern>
    <filter id="grain-la">
      <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.04"/></feComponentTransfer>
    </filter>
  </defs>
  <rect width="1200" height="800" fill="#edf2eb"/>
  <rect width="1200" height="800" fill="url(#grid-la)"/>
  <g fill="none" stroke-linecap="round">
    <path d="M190 560C340 460 410 250 610 240c200-10 290 160 400 290" stroke="#8fa89d" stroke-width="1.6" stroke-dasharray="5 7" opacity="0.55"/>
    <path d="M190 560C330 380 510 180 700 240c180 58 230 210 310 290" stroke="#8fa89d" stroke-width="1.4" stroke-dasharray="3 8" opacity="0.38"/>
    <path d="M190 560C390 500 500 380 610 300c110-80 230-80 400 250" stroke="#8fa89d" stroke-width="1.4" stroke-dasharray="3 8" opacity="0.38"/>
    <path d="M190 560C370 580 450 380 610 300c180-90 280 80 400 250" stroke="#0e6b54" stroke-width="5"/>
  </g>
  <g fill="#17211c">
    <circle cx="190" cy="560" r="10"/>
    <circle cx="1010" cy="550" r="10"/>
    <text x="164" y="606" font-family="Georgia, serif" font-size="23">A</text>
    <text x="1018" y="596" font-family="Georgia, serif" font-size="23">B</text>
  </g>
  <g fill="#b1783a">
    <circle cx="610" cy="300" r="7"/>
    <circle cx="610" cy="300" r="18" fill="none" stroke="#b1783a" stroke-opacity="0.4"/>
  </g>
  <text x="628" y="288" font-family="Georgia, serif" font-size="22" fill="#b1783a">δS = 0</text>
  <g transform="translate(150 140)">
    <text x="0" y="0" font-family="Consolas, monospace" font-size="12" fill="#65716a" letter-spacing="2">LEAST ACTION / A CHOICE OF PATH</text>
    <text x="0" y="52" font-family="Georgia, serif" font-size="35" fill="#17211c">S[q] = ∫ L dt</text>
  </g>
  <text x="828" y="210" font-family="Consolas, monospace" font-size="11" fill="#65716a" letter-spacing="1">all possible paths</text>
  <text x="810" y="642" font-family="Consolas, monospace" font-size="11" fill="#0e6b54" letter-spacing="1">the stationary path</text>
  <rect width="1200" height="800" filter="url(#grain-la)" opacity="0.9"/>
  <rect x="28" y="28" width="1144" height="744" fill="none" stroke="#17211c" stroke-opacity="0.12"/>
</svg>
