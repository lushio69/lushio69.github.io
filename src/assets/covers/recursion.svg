<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-label="递归调用树和不断缩小的规模">
  <defs>
    <pattern id="grid-rc" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#0e6b54" stroke-opacity="0.08" stroke-width="1"/>
    </pattern>
    <filter id="grain-rc">
      <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.04"/></feComponentTransfer>
    </filter>
  </defs>
  <rect width="1200" height="800" fill="#edf2eb"/>
  <rect width="1200" height="800" fill="url(#grid-rc)"/>
  <g fill="none" stroke="#65716a" stroke-width="1.6">
    <path d="M600 150v110M600 260L360 400M600 260l240 140M360 400L240 540M360 400l120 140M840 400L720 540M840 400l120 140"/>
  </g>
  <g>
    <rect x="540" y="108" width="120" height="66" fill="#0e6b54"/>
    <text x="600" y="149" text-anchor="middle" font-family="Consolas, monospace" font-size="14" fill="#f1f4ee">f(n)</text>
    <rect x="300" y="382" width="120" height="62" fill="#f8faf5" stroke="#17211c" stroke-opacity="0.25"/>
    <text x="360" y="419" text-anchor="middle" font-family="Consolas, monospace" font-size="13" fill="#17211c">f(n−1)</text>
    <rect x="780" y="382" width="120" height="62" fill="#f8faf5" stroke="#17211c" stroke-opacity="0.25"/>
    <text x="840" y="419" text-anchor="middle" font-family="Consolas, monospace" font-size="13" fill="#17211c">f(n−2)</text>
    <rect x="180" y="522" width="120" height="58" fill="#f8faf5" stroke="#b1783a" stroke-opacity="0.55"/>
    <text x="240" y="557" text-anchor="middle" font-family="Consolas, monospace" font-size="13" fill="#b1783a">f(1)</text>
    <rect x="360" y="522" width="120" height="58" fill="#f8faf5" stroke="#b1783a" stroke-opacity="0.55"/>
    <text x="420" y="557" text-anchor="middle" font-family="Consolas, monospace" font-size="13" fill="#b1783a">f(0)</text>
    <rect x="660" y="522" width="120" height="58" fill="#f8faf5" stroke="#17211c" stroke-opacity="0.2"/>
    <text x="720" y="557" text-anchor="middle" font-family="Consolas, monospace" font-size="13" fill="#65716a">…</text>
    <rect x="840" y="522" width="120" height="58" fill="#f8faf5" stroke="#17211c" stroke-opacity="0.2"/>
    <text x="900" y="557" text-anchor="middle" font-family="Consolas, monospace" font-size="13" fill="#65716a">f(0)</text>
  </g>
  <path d="M980 150c-35 90-66 160-95 214" fill="none" stroke="#b1783a" stroke-width="1.4" stroke-dasharray="5 6"/>
  <text x="944" y="238" font-family="Georgia, serif" font-size="18" fill="#b1783a">smaller</text>
  <g transform="translate(150 130)">
    <text x="0" y="0" font-family="Consolas, monospace" font-size="12" fill="#65716a" letter-spacing="2">RECURSION / A DESCENDING MEASURE</text>
    <text x="0" y="52" font-family="Georgia, serif" font-size="34" fill="#17211c">n → n − 1 → … → 0</text>
  </g>
  <rect width="1200" height="800" filter="url(#grain-rc)" opacity="0.9"/>
  <rect x="28" y="28" width="1144" height="744" fill="none" stroke="#17211c" stroke-opacity="0.12"/>
</svg>
