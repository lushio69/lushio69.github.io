<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-label="矩阵的两个特征方向">
  <defs>
    <pattern id="grid-ev" width="44" height="44" patternUnits="userSpaceOnUse">
      <path d="M44 0H0V44" fill="none" stroke="#0e6b54" stroke-opacity="0.09" stroke-width="1"/>
    </pattern>
    <marker id="arrow-ev" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0l10 5-10 5z" fill="#0e6b54"/>
    </marker>
    <marker id="arrow-ev2" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0l10 5-10 5z" fill="#b1783a"/>
    </marker>
    <filter id="grain-ev">
      <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.04"/></feComponentTransfer>
    </filter>
  </defs>
  <rect width="1200" height="800" fill="#e9efe8"/>
  <rect width="1200" height="800" fill="url(#grid-ev)"/>
  <g transform="translate(-60 120) skewY(10)" opacity="0.28">
    <rect width="700" height="520" fill="none" stroke="#b1783a" stroke-width="1.5"/>
    <path d="M0 130h700M0 260h700M0 390h700M130 0v520M260 0v520M390 0v520M520 0v520" stroke="#b1783a" stroke-width="1"/>
  </g>
  <g transform="translate(440 470)">
    <line x1="-230" y1="0" x2="540" y2="0" stroke="#17211c" stroke-width="1.3" opacity="0.7"/>
    <line x1="0" y1="180" x2="0" y2="-360" stroke="#17211c" stroke-width="1.3" opacity="0.7"/>
    <line x1="0" y1="0" x2="306" y2="-176" stroke="#0e6b54" stroke-width="4" marker-end="url(#arrow-ev)"/>
    <line x1="0" y1="0" x2="208" y2="208" stroke="#b1783a" stroke-width="4" marker-end="url(#arrow-ev2)"/>
    <circle cx="0" cy="0" r="7" fill="#17211c"/>
    <text x="316" y="-182" font-family="Georgia, serif" font-size="23" fill="#0e6b54">λ₁v₁</text>
    <text x="216" y="238" font-family="Georgia, serif" font-size="23" fill="#b1783a">λ₂v₂</text>
    <line x1="0" y1="0" x2="204" y2="-118" stroke="#0e6b54" stroke-width="2" stroke-dasharray="6 7" opacity="0.55"/>
    <line x1="0" y1="0" x2="139" y2="139" stroke="#b1783a" stroke-width="2" stroke-dasharray="6 7" opacity="0.55"/>
  </g>
  <g transform="translate(150 150)">
    <text x="0" y="0" font-family="Consolas, monospace" font-size="12" fill="#65716a" letter-spacing="2">EIGENVECTORS / INVARIANTS</text>
    <text x="0" y="58" font-family="Georgia, serif" font-size="38" fill="#17211c">A v = λ v</text>
    <text x="0" y="94" font-family="Consolas, monospace" font-size="13" fill="#0e6b54">direction survives, length scales</text>
  </g>
  <g transform="translate(922 560)" opacity="0.9">
    <rect x="0" y="0" width="118" height="102" fill="#f8faf5" stroke="#17211c" stroke-opacity="0.2"/>
    <text x="59" y="44" text-anchor="middle" font-family="Georgia, serif" font-size="30" fill="#17211c">2</text>
    <text x="59" y="82" text-anchor="middle" font-family="Georgia, serif" font-size="30" fill="#b1783a">1</text>
    <text x="37" y="44" text-anchor="middle" font-family="Georgia, serif" font-size="30" fill="#b1783a">1</text>
    <text x="37" y="82" text-anchor="middle" font-family="Georgia, serif" font-size="30" fill="#17211c">2</text>
  </g>
  <rect width="1200" height="800" filter="url(#grain-ev)" opacity="0.9"/>
  <rect x="28" y="28" width="1144" height="744" fill="none" stroke="#17211c" stroke-opacity="0.12"/>
</svg>
