<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-label="100 天学会微积分专栏封面">
  <defs>
    <pattern id="grid-sc" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#0e6b54" stroke-opacity="0.09" stroke-width="1"/>
    </pattern>
    <filter id="grain-sc">
      <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.04"/></feComponentTransfer>
    </filter>
  </defs>
  <rect width="1200" height="800" fill="#0e6b54"/>
  <rect width="1200" height="800" fill="url(#grid-sc)" opacity="0.8"/>
  <circle cx="980" cy="180" r="200" fill="none" stroke="#f1f4ee" stroke-opacity="0.18" stroke-width="1"/>
  <circle cx="980" cy="180" r="142" fill="none" stroke="#f1f4ee" stroke-opacity="0.14" stroke-width="1"/>
  <path d="M160 610C330 580 430 430 560 340c130-90 260-110 470-30" fill="none" stroke="#f1f4ee" stroke-width="3" opacity="0.9"/>
  <path d="M160 610h880" stroke="#f1f4ee" stroke-opacity="0.3"/>
  <path d="M160 610V180" stroke="#f1f4ee" stroke-opacity="0.3"/>
  <text x="150" y="142" font-family="Consolas, monospace" font-size="12" fill="#cfe1d8" letter-spacing="2">A LONG-FORM SERIES</text>
  <text x="144" y="326" font-family="Georgia, serif" font-size="180" fill="#f1f4ee">100</text>
  <text x="520" y="310" font-family="Georgia, serif" font-size="44" fill="#f1f4ee">天学会</text>
  <text x="520" y="370" font-family="Georgia, serif" font-size="44" fill="#d3a061">微积分</text>
  <text x="158" y="712" font-family="Georgia, serif" font-size="21" fill="#cfe1d8">DAY 01 → DAY 100</text>
  <text x="916" y="712" font-family="Consolas, monospace" font-size="11" fill="#cfe1d8" letter-spacing="1.5">ONE SMALL IDEA AT A TIME</text>
  <rect width="1200" height="800" filter="url(#grain-sc)" opacity="0.9"/>
  <rect x="28" y="28" width="1144" height="744" fill="none" stroke="#f1f4ee" stroke-opacity="0.18"/>
</svg>
